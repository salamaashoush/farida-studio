name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx tsc
      - run: bun test
      # The pinned editor still downloads and matches its checksum.
      - run: bun install.ts .studio && test -f .studio/editor/scratch-gui-standalone.js
